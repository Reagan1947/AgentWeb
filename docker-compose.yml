# AgentWeb, nono, and Steel on one machine: `cp .env.docker.example .env && docker compose up -d --build`
services:
  app:
    build:
      context: .
      args:
        AGENT_UID: ${AGENT_UID:-1000}
        OPTIONAL_TOOLS: ${OPTIONAL_TOOLS:-}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      SERVER_PORT: 3001
      WORKSPACES_ROOT: /workspace
      AUTH_PROXY_COOKIE_DOMAIN: ${PUBLIC_DOMAIN:-}
      CORS_ORIGINS: ${PUBLIC_DOMAIN:+https://${PUBLIC_DOMAIN}}
    # Steel shares this network namespace, so its ports are published here.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${AGENTWEB_PORT:-3001}:3001"
      - "${BIND_ADDRESS:-127.0.0.1}:3000:3000"
    volumes:
      - agent-home:/home/agent
      - ${WORKSPACE_DIR:-./workspace}:/workspace

  # Sharing `localhost` keeps AgentWeb's default Steel address working and lets
  # Steel's Chrome open dev servers the agents start. Agents cannot use 3000 or 9223.
  steel:
    # Steel publishes only a latest image, and its next commit (5151a78) breaks the live view:
    # the viewer connects without the session id the cast handler started requiring. Built
    # from source so an upstream release cannot change this. Move STEEL_REF past it once fixed.
    image: agentweb-steel:${STEEL_REF:-c14ce950213839fdc92feff4ab2a8eb2f3b80a6d}
    build:
      context: https://github.com/steel-dev/steel-browser.git#${STEEL_REF:-c14ce950213839fdc92feff4ab2a8eb2f3b80a6d}
    restart: unless-stopped
    network_mode: service:app
    depends_on:
      - app
    environment:
      # The address your browser uses for Steel. The live view loads from it.
      DOMAIN: ${STEEL_DOMAIN:-localhost:3000}
      USE_SSL: ${STEEL_USE_SSL:-false}

  # HTTPS for a public domain: set COMPOSE_PROFILES=https and PUBLIC_DOMAIN.
  caddy:
    image: caddy:2.11.7
    profiles: [https]
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-}
      STEEL_DOMAIN: ${STEEL_DOMAIN:-}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  agent-home:
  caddy-data:
  caddy-config:
